[project]
name = "wie-lernen-neuronale-netze"
version = "2.0.0"
description = "How Neural Networks Learn - Information Bottleneck Theory Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.9.0",
    "torchvision>=0.20.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.1.0",
    "graphviz>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["idnns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
